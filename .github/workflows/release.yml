name: 🚀 Release

on:
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          registry-url: "https://registry.npmjs.org"

      - id: setup-bun
        name: 🛠️ Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - id: install-deps
        name: 📦 Install Dependencies
        run: bun install

      - id: test
        name: ✅ Run test
        run: |
          bun test

      - name: 🔨 Build Packages
        run: bun run build

      # Only @specify-sh/sdk is published; @specify-sh/core is private and is
      # bundled into the sdk's dist output.
      - name: 📤 Publish to NPM
        run: npm publish --access public
        working-directory: packages/sdk
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
