name: 📦 PR Builder

on:
  pull_request:
    branches:
      - main

env:
  NPM_CONFIG_PROVENANCE: true

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - id: checkout
        name: 📥 Checkout
        uses: actions/checkout@v4

      - id: setup-bun
        name: 🛠️ Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - id: install-deps
        name: 📦 Install Dependencies
        run: bun install --frozen-lockfile

      - id: test
        name: ✅ Run test
        run: |
          bun test

      - id: types
        name: 🔎 Typecheck
        run: bun run types

      - id: build
        name: 🔨 Build Packages
        run: bun run build
